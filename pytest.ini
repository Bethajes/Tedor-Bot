[pytest]
testpaths = tests
asyncio_mode = auto
# ROS pytest plugins leak into the interpreter via PYTHONPATH; disable them.
addopts = -p no:launch_testing -p no:launch_ros -p no:ament_flake8 -p no:ament_lint -p no:ament_pep257 -p no:ament_copyright -p no:ament_xmllint
filterwarnings =
    ignore::DeprecationWarning
markers =
    property: property-based tests written with hypothesis